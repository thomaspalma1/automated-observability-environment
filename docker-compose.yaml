services:
  http-server:
    build: .
    container_name: http-server
    networks:
      - observability-network

  nginx:
    image: nginx:1.30.4
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - /etc/automated-observability-environment/nginx:/etc/nginx/conf.d
    networks:
      - observability-network
    depends_on:
      - http-server

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - /etc/automated-observability-environment/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
    networks:
      - observability-network

  grafana:
    image: grafana/grafana:13.1.2
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - /etc/automated-observability-environment/grafana/provisioning:/etc/grafana/provisioning
      - /etc/automated-observability-environment/grafana/dashboards:/etc/grafana/dashboards
    networks:
      - observability-network

networks:
  observability-network:
    external: true
