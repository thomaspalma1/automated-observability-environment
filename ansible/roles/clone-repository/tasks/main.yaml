---
- name: Install git
  ansible.builtin.apt:
    name: git
    state: present

- name: Clone the project repository
  ansible.builtin.git:
    repo: "https://github.com/thomaspalma1/automated-observability-environment.git"
    dest: "/opt/automated-observability-environment"
    version: main
    force: true

- name: Ensure repository ownership belongs to the deployment user
  ansible.builtin.file:
    path: "/opt/automated-observability-environment"
    owner: "{{ deployment_user }}"
    group: "{{ deployment_user }}"
    recurse: true
